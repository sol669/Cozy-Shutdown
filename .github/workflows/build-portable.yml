name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content Shutdown-WinUI3-Source/src/Shutdown/Shutdown.csproj
          # The project has configuration-specific property groups without a Version.
          # Select the one actual version value instead of casting the whole XML list.
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag and application version do not match.'
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Verify action policy and settings migration
        run: dotnet run --project tests/Shutdown.PolicyTests.csproj -c Release

      - name: Publish offline app
        run: >
          dotnet publish Shutdown-WinUI3-Source/src/Shutdown/Shutdown.csproj
          -c Release -r win-x64 --self-contained true -p:Platform=x64
          -p:IntermediateOutputPath=obj/ReleaseOffline/ -p:OutputPath=bin/ReleaseOffline/
          -o publish

      - name: Publish standard app
        run: >
          dotnet publish Shutdown-WinUI3-Source/src/Shutdown/Shutdown.csproj
          -c Release -r win-x64 --self-contained false -p:Platform=x64
          -p:WindowsAppSDKSelfContained=false -p:PublishSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=false -p:IncludeAllContentForSelfExtract=false
          -p:IntermediateOutputPath=obj/ReleaseStandard/ -p:OutputPath=bin/ReleaseStandard/
          -o publish-standard

      - name: Validate packages and create portable archives
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          foreach ($folder in @('publish', 'publish-standard')) {
            $actual = (Get-Item "$folder/CozyShutdown.exe").VersionInfo.FileVersion
            if ($actual -ne "$version.0") { throw "Wrong executable version in $folder : $actual" }
            foreach ($file in @('CozyShutdown.dll', 'CozyShutdown.runtimeconfig.json', 'CozyShutdown.pri', 'Assets/ShutdownTrey.ico')) {
              if (-not (Test-Path "$folder/$file")) { throw "Missing $folder/$file" }
            }
            Copy-Item README.md "$folder/README.md"
            Copy-Item LICENSE "$folder/LICENSE.txt"
          }
          # WinUI is supplied by the Windows App Runtime installer; the .NET runtime
          # remains embedded in the offline package.
          foreach ($file in @('coreclr.dll', 'hostfxr.dll')) {
            if (-not (Test-Path "publish/$file")) { throw "Offline runtime missing: $file" }
          }
          if (Test-Path 'publish-standard/coreclr.dll') { throw 'Standard package contains offline runtime.' }
          Copy-Item installer/README-Portable.txt publish-standard/README.txt
          Copy-Item README.md publish/README.txt
          New-Item -ItemType Directory release -Force | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "release/Cozy-Shutdown-Portable-Offline-v$version-win-x64.zip" -CompressionLevel Optimal
          Compress-Archive -Path publish-standard/* -DestinationPath "release/Cozy-Shutdown-Portable-v$version-win-x64.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build both installers
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = '${{ steps.version.outputs.value }}'
          & $compiler "/DAppVersion=$version" "/DPublishDir=$env:GITHUB_WORKSPACE\publish" installer/Shutdown.iss
          if ($LASTEXITCODE -ne 0) { throw 'Offline installer failed.' }
          & $compiler "/DAppVersion=$version" "/DPublishDir=$env:GITHUB_WORKSPACE\publish-standard" installer/Shutdown-Online.iss
          if ($LASTEXITCODE -ne 0) { throw 'Online installer failed.' }
          $packages = @(Get-ChildItem release -File)
          if ($packages.Count -ne 4) { throw 'Expected exactly four release packages.' }
          $packages | Get-FileHash -Algorithm SHA256 | Format-List

      - name: Keep all four packages
        uses: actions/upload-artifact@v4
        with:
          name: Cozy-Shutdown-v${{ steps.version.outputs.value }}-packages
          path: release/*
          if-no-files-found: error
          compression-level: 0

      - name: Prepare draft release for verification
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Cozy Shutdown ${{ steps.version.outputs.value }}
          body_path: RELEASE-NOTES.md
          draft: true
          files: release/*
          fail_on_unmatched_files: true
