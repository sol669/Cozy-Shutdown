name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Shutdown-WinUI3-Source/src/Shutdown/Shutdown.csproj -r win-x64

      - name: Publish offline self-contained app
        run: dotnet publish Shutdown-WinUI3-Source/src/Shutdown/Shutdown.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:EnableMsixTooling=true -o publish

      - name: Create offline portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath Shutdown-Trey-Portable-Offline-win-x64.zip -CompressionLevel Optimal

      - name: Publish standard framework-dependent app
        run: >
          dotnet publish Shutdown-WinUI3-Source/src/Shutdown/Shutdown.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=false
          -p:PublishSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=false
          -p:IncludeAllContentForSelfExtract=false
          -o publish-standard

      - name: Create standard portable ZIP
        shell: pwsh
        run: |
          Copy-Item installer\README-Portable.txt publish-standard\README-Portable.txt
          Compress-Archive -Path publish-standard\* -DestinationPath Shutdown-Trey-Portable-win-x64.zip -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build offline installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=1.1.1 "installer\Shutdown.iss"'

      - name: Build standard online installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=1.1.1 "installer\Shutdown-Online.iss"'

      - name: Upload offline portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shutdown-Portable-Offline-win-x64
          path: Shutdown-Trey-Portable-Offline-win-x64.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload offline installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shutdown-Trey-Setup-Offline-win-x64
          path: release/Shutdown-Trey-Setup-Offline-v1.1.1.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload standard portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shutdown-Portable-win-x64
          path: Shutdown-Trey-Portable-win-x64.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload standard installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shutdown-Trey-Setup-win-x64
          path: release/Shutdown-Trey-Setup-v1.1.1.exe
          if-no-files-found: error
          compression-level: 0

      - name: Add files to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          files: |
            Shutdown-Trey-Portable-win-x64.zip
            release/Shutdown-Trey-Setup-v1.1.1.exe
            Shutdown-Trey-Portable-Offline-win-x64.zip
            release/Shutdown-Trey-Setup-Offline-v1.1.1.exe
          fail_on_unmatched_files: true
          overwrite_files: true
